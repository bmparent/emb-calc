name: Sign iOS candidate
on:
  workflow_dispatch:
    inputs:
      rc_sha:
        description: Reviewed 40-character release candidate commit
        required: true
        type: string
      build_number:
        description: New App Store build number (1-9999)
        required: true
        type: string
      upload_testflight:
        description: Validate and upload the signed IPA to App Store Connect
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: embroiderycalc-ios-signing
  cancel-in-progress: false
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      RC_SHA: ${{ inputs.rc_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_sha }}
          persist-credentials: false
      - name: Validate signing configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/ios-signing-preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s qa/signing -v
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:native
      - name: Archive and optionally upload candidate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/archive-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-ios-${{ inputs.rc_sha }}-build-${{ inputs.build_number }}
          path: artifacts/ios-signing/
          if-no-files-found: ignore
          retention-days: 7
